<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .rocket { animation: rocket 1.5s ease-in-out infinite; }
    @keyframes rocket { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .flame { animation: flame 0.3s ease-in-out infinite; }
    @keyframes flame { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.7)} }
    .smoke { animation: smoke 1s ease-out infinite; }
    @keyframes smoke { 0%{transform:translateY(0) scale(1);opacity:0.6} 100%{transform:translateY(15px) scale(2);opacity:0} }
    .stars { animation: twinkle 1s ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:1} }
  </style>
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>
  <rect x="78" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <rect x="106" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <rect x="74" y="172" width="24" height="12" rx="6" fill="#78350F"/>
  <rect x="102" y="172" width="24" height="12" rx="6" fill="#78350F"/>
  <rect x="72" y="95" width="56" height="60" rx="12" fill="#3B82F6"/>
  <rect x="72" y="120" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <rect x="72" y="135" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <rect x="52" y="100" width="20" height="12" rx="6" fill="#3B82F6"/>
  <circle cx="50" cy="106" r="8" fill="#FDE68A"/>
  <g class="rocket">
    <rect x="128" y="95" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="150" cy="95" r="8" fill="#FDE68A"/>
    <!-- Ракета -->
    <g transform="translate(155,60) rotate(-45)">
      <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#EF4444"/>
      <rect x="-6" y="-8" width="12" height="18" rx="3" fill="#F3F4F6"/>
      <rect x="-6" y="5" width="12" height="5" rx="1" fill="#3B82F6"/>
      <polygon points="-8,10 -12,18 -4,14" fill="#F59E0B"/>
      <polygon points="8,10 12,18 4,14" fill="#F59E0B"/>
      <g class="flame">
        <ellipse cx="0" cy="16" rx="4" ry="8" fill="#F97316"/>
        <ellipse cx="0" cy="18" rx="2.5" ry="5" fill="#FDE333"/>
      </g>
    </g>
  </g>
  <circle cx="100" cy="70" r="30" fill="#FDE68A"/>
  <path d="M65 65 Q100 25 135 65 L130 70 Q100 40 70 70 Z" fill="#F59E0B"/>
  <rect x="65" y="65" width="70" height="8" rx="4" fill="#D97706"/>
  <rect x="95" y="52" width="10" height="8" rx="2" fill="#FBBF24"/>
  <circle cx="88" cy="72" r="5" fill="white"/>
  <circle cx="112" cy="72" r="5" fill="white"/>
  <circle cx="88" cy="70" r="3" fill="#1E293B"/>
  <circle cx="112" cy="70" r="3" fill="#1E293B"/>
  <path d="M85 82 Q100 96 115 82" stroke="#92400E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Звёзды -->
  <text x="55" y="40" font-size="8" class="stars">⭐</text>
  <text x="40" y="60" font-size="6" class="stars" style="animation-delay:0.3s">✨</text>
  <text x="65" y="30" font-size="7" class="stars" style="animation-delay:0.6s">🌟</text>
  <g class="smoke">
    <circle cx="168" cy="95" r="4" fill="#94A3B8" opacity="0.4"/>
    <circle cx="173" cy="100" r="3" fill="#94A3B8" opacity="0.3"/>
  </g>
</svg>
