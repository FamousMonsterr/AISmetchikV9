<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .bulb { animation: glow 1.5s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:0.3;filter:blur(2px)} 50%{opacity:1;filter:blur(0)} }
    .spark { animation: spark 0.8s ease-out infinite; }
    @keyframes spark { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.5);opacity:0} }
    .eyes-widen { animation: widen 2s ease-in-out infinite; }
    @keyframes widen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  </style>
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>
