name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip E2E when secrets are unavailable
        if: env.E2E_BASE_URL == '' || env.E2E_USER_EMAIL == '' || env.E2E_USER_PASSWORD == ''
        run: echo "E2E secrets are missing; skipping Playwright job."

      - name: Install Playwright
        if: env.E2E_BASE_URL != '' && env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != ''
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: env.E2E_BASE_URL != '' && env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != ''
        run: npm run test:e2e

  smoke-subdomains:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    env:
      SMOKE_DOMAINS: ${{ secrets.SMOKE_DOMAINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke checks
        run: npm run test:smoke-subdomains
