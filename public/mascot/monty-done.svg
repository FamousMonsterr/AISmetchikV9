<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .thumb { animation: thumb 0.5s ease-out; transform-origin: 150px 90px; }
    @keyframes thumb { 0%{transform:scale(0) rotate(-30deg)} 60%{transform:scale(1.2) rotate(5deg)} 100%{transform:scale(1) rotate(0)} }
    .check { animation: check 0.6s ease-out 0.2s both; }
    @keyframes check { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
    .confetti { animation: confetti 1.5s ease-out infinite; }
    @keyframes confetti { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(-40px) rotate(360deg);opacity:0} }
  </style>
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>
