<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
  </defs>

  <!-- Тень -->
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>

  <!-- Ноги -->
  <rect x="78" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <rect x="106" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <!-- Ботинки -->
  <rect x="74" y="172" width="24" height="12" rx="6" fill="#78350F"/>
  <rect x="102" y="172" width="24" height="12" rx="6" fill="#78350F"/>

  <!-- Тело (жилет) -->
  <rect x="72" y="95" width="56" height="60" rx="12" fill="url(#bodyGrad)"/>
  <!-- Светоотражающие полосы -->
  <rect x="72" y="120" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <rect x="72" y="135" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <!-- Карманы -->
  <rect x="80" y="105" width="14" height="10" rx="2" fill="#2563EB" stroke="#1E40AF" stroke-width="1"/>
  <rect x="106" y="105" width="14" height="10" rx="2" fill="#2563EB" stroke="#1E40AF" stroke-width="1"/>

  <!-- Руки -->
  <!-- Левая рука -->
  <g class="arm-left">
    <rect x="52" y="100" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="50" cy="106" r="8" fill="#FDE68A"/>
  </g>
  <!-- Правая рука с инструментом -->
  <g class="arm-right">
    <rect x="128" y="100" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="150" cy="106" r="8" fill="#FDE68A"/>
    <!-- Отвертка -->
    <rect x="152" y="95" width="4" height="22" rx="2" fill="#9CA3AF"/>
    <rect x="149" y="92" width="10" height="6" rx="2" fill="#EF4444"/>
  </g>

  <!-- Голова -->
  <circle cx="100" cy="70" r="30" fill="url(#faceGrad)"/>

  <!-- Каска -->
  <path d="M65 65 Q100 25 135 65 L130 70 Q100 40 70 70 Z" fill="url(#hatGrad)"/>
  <rect x="65" y="65" width="70" height="8" rx="4" fill="#D97706"/>
  <!-- Козырёк каски -->
  <rect x="58" y="68" width="20" height="5" rx="2.5" fill="#B45309"/>
  <!-- Фонарик на каске -->
  <rect x="95" y="52" width="10" height="8" rx="2" fill="#FBBF24"/>
  <circle cx="100" cy="50" r="4" fill="#FEF3C7" class="light-glow"/>

  <!-- Глаза -->
  <g class="eyes">
    <circle cx="88" cy="72" r="5" fill="white"/>
    <circle cx="112" cy="72" r="5" fill="white"/>
    <circle cx="90" cy="72" r="3" fill="#1E293B"/>
    <circle cx="114" cy="72" r="3" fill="#1E293B"/>
    <!-- Блики -->
    <circle cx="91" cy="71" r="1.2" fill="white"/>
    <circle cx="115" cy="71" r="1.2" fill="white"/>
  </g>

  <!-- Улыбка -->
  <path d="M90 84 Q100 94 110 84" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round" class="mouth"/>

  <!-- Щёчки -->
  <circle cx="80" cy="82" r="5" fill="#F97316" opacity="0.3"/>
  <circle cx="120" cy="82" r="5" fill="#F97316" opacity="0.3"/>

  <!-- Брови -->
  <path d="M82 62 Q88 58 94 62" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M106 62 Q112 58 118 62" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Ус -->
  <line x1="92" y1="80" x2="82" y2="78" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="80" x2="118" y2="78" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
</svg>
