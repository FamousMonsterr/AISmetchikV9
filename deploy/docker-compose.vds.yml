x-app: &app_base
  restart: unless-stopped
  env_file:
    - ../.env
  environment:
    NODE_ENV: production
    PORT: 3000
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app_base
    image: ai-smetchik-web:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *app_base
    image: ai-smetchik-worker:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7
    restart: unless-stopped
    profiles:
      - with-mongo
    command: ["--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
