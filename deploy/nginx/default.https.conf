upstream landing_upstream {
    server web_landing:3000;
}

upstream admin_upstream {
    server web_admin:3000;
}

upstream lk_upstream {
    server web_lk:3000;
}

upstream crm_upstream {
    server web_crm:3000;
}

upstream partner_upstream {
    server web_partner:3000;
}

upstream mobile_upstream {
    server web_mobile:3000;
}

map $host $target_upstream {
    default         landing_upstream;
    ~^admin\.       admin_upstream;
    ~^lk\.          lk_upstream;
    ~^crm\.         crm_upstream;
    ~^partner\.     partner_upstream;
    ~^m\.           mobile_upstream;
}

server {
    listen 80;
    server_name __SERVER_NAMES__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__PRIMARY_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PRIMARY_DOMAIN__/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://$target_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
