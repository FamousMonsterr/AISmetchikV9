services:
  api:
    image: ghcr.io/famousmonsterr/montagehub-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_SURFACE: api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/famousmonsterr/montagehub-worker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    logging:
      options:
        max-size: "10m"
        max-file: "3"
