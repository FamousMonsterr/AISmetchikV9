# Montage HUB — Nginx configuration
# montagehub.ru + subdomains

upstream web_landing {
    server web_landing:3000;
}
upstream web_lk {
    server web_lk:3000;
}
upstream web_admin {
    server web_admin:3000;
}
upstream web_crm {
    server web_crm:3000;
}
upstream web_partner {
    server web_partner:3000;
}
upstream web_mobile {
    server web_mobile:3000;
}
upstream api_backend {
    server 10.16.0.2:3000;
}

# montagehub.ru — Landing
server {
    listen 80;
    server_name montagehub.ru www.montagehub.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

