<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .screw { animation: screw 0.6s linear infinite; transform-origin: 155px 106px; }
    @keyframes screw { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    .arm-work { animation: armWork 0.6s ease-in-out infinite; transform-origin: 135px 100px; }
    @keyframes armWork { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-10deg)} }
    .sweat { animation: sweat 1.5s ease-out infinite; }
    @keyframes sweat { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-15px);opacity:0} }
  </style>
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>
  <rect x="78" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <rect x="106" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
  <rect x="74" y="172" width="24" height="12" rx="6" fill="#78350F"/>
  <rect x="102" y="172" width="24" height="12" rx="6" fill="#78350F"/>
  <rect x="72" y="95" width="56" height="60" rx="12" fill="#3B82F6"/>
  <rect x="72" y="120" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <rect x="72" y="135" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
  <rect x="52" y="100" width="20" height="12" rx="6" fill="#3B82F6"/>
  <circle cx="50" cy="106" r="8" fill="#FDE68A"/>
  <g class="arm-work">
    <rect x="128" y="100" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="150" cy="106" r="8" fill="#FDE68A"/>
    <g class="screw">
      <rect x="155" y="96" width="4" height="20" rx="2" fill="#9CA3AF"/>
      <rect x="152" y="93" width="10" height="6" rx="2" fill="#EF4444"/>
    </g>
  </g>
  <circle cx="100" cy="70" r="30" fill="#FDE68A"/>
  <path d="M65 65 Q100 25 135 65 L130 70 Q100 40 70 70 Z" fill="#F59E0B"/>
  <rect x="65" y="65" width="70" height="8" rx="4" fill="#D97706"/>
  <rect x="95" y="52" width="10" height="8" rx="2" fill="#FBBF24"/>
  <circle cx="88" cy="72" r="5" fill="white"/>
  <circle cx="112" cy="72" r="5" fill="white"/>
  <circle cx="90" cy="72" r="3" fill="#1E293B"/>
  <circle cx="114" cy="72" r="3" fill="#1E293B"/>
