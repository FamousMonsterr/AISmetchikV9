name: Deploy VDS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-vds
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required deploy secrets
        id: check
        env:
          VDS_SSH_HOST: ${{ secrets.VDS_SSH_HOST }}
          VDS_SSH_USER: ${{ secrets.VDS_SSH_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_DEPLOY_PATH: ${{ secrets.VDS_DEPLOY_PATH }}
          VDS_DOMAIN: ${{ secrets.VDS_DOMAIN }}
          VDS_SUBDOMAINS: ${{ secrets.VDS_SUBDOMAINS }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          missing=0
          for var in VDS_SSH_HOST VDS_SSH_USER VDS_SSH_KEY VDS_DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "::warning::Missing secret: ${var}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: configure required secrets first."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Deploy secrets are configured."
          if [ -n "$VDS_DOMAIN" ] && [ -z "$LETSENCRYPT_EMAIL" ]; then
            echo "::warning::VDS_DOMAIN is set but LETSENCRYPT_EMAIL is missing. TLS auto-setup will be skipped."
          fi
          if [ -z "$VDS_DOMAIN" ] && [ -n "$LETSENCRYPT_EMAIL" ]; then
            echo "::warning::LETSENCRYPT_EMAIL is set but VDS_DOMAIN is missing. TLS auto-setup will be skipped."
          fi
          if [ -n "$VDS_DOMAIN" ] && [ -z "$VDS_SUBDOMAINS" ]; then
            echo "::notice::VDS_SUBDOMAINS is not set. Default subdomains (admin,lk,crm,partner,m) will be used."
          fi

  deploy:
    needs: preflight
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) &&
      needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_SSH_HOST }}
          username: ${{ secrets.VDS_SSH_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: false
          script: |
            set -ex
            TLS_DOMAIN="${{ secrets.VDS_DOMAIN }}"
            TLS_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"
            TLS_SUBDOMAINS="${{ secrets.VDS_SUBDOMAINS }}"
            case "$TLS_SUBDOMAINS" in
              "") TLS_SUBDOMAINS="admin,lk,crm,partner,m" ;;
              *) : ;;
            esac
            TLS_ENABLED=0
            case "$TLS_DOMAIN" in
              "")
                TLS_ENABLED=0
              ;;
              *)
                case "$TLS_EMAIL" in
                  "") TLS_ENABLED=0 ;;
                  *) TLS_ENABLED=1 ;;
                esac
              ;;
            esac
            SERVER_NAMES="_"
            PRIMARY_DOMAIN="$TLS_DOMAIN"
            CERTBOT_DOMAINS=()
            case "$TLS_ENABLED" in
              1)
                SERVER_NAMES="$TLS_DOMAIN"
                CERTBOT_DOMAINS=("$TLS_DOMAIN")
                IFS=',' read -r -a SUBDOMAIN_ARR <<< "$TLS_SUBDOMAINS"
                for raw_sub in "${SUBDOMAIN_ARR[@]}"; do
                  sub="$(echo "$raw_sub" | xargs)"
                  if [ -z "$sub" ]; then
                    continue
                  fi
                  fqdn="${sub}.${TLS_DOMAIN}"
                  SERVER_NAMES="${SERVER_NAMES} ${fqdn}"
                  CERTBOT_DOMAINS+=("$fqdn")
                done
              ;;
              *) : ;;
            esac
            compose_cmd() {
              docker compose --env-file deploy/.env.vds -f deploy/docker-compose.vds.yml "$@"
            }
            cd "${{ secrets.VDS_DEPLOY_PATH || '/opt/ai-smetchik' }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            df -h
            docker system df || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            mkdir -p deploy/nginx/certbot/www deploy/nginx/certbot/conf
            case "$TLS_ENABLED" in
              1) sed "s/__SERVER_NAMES__/$SERVER_NAMES/g" deploy/nginx/default.http.conf > deploy/nginx/default.conf ;;
              *) sed "s/__SERVER_NAMES__/_/g" deploy/nginx/default.http.conf > deploy/nginx/default.conf ;;
            esac

            compose_cmd up -d --build --remove-orphans

            case "$TLS_ENABLED" in
              1)
                certbot_args=()
                for domain in "${CERTBOT_DOMAINS[@]}"; do
                  certbot_args+=("-d" "$domain")
                done
                docker run --rm \
                  -v "$(pwd)/deploy/nginx/certbot/www:/var/www/certbot" \
                  -v "$(pwd)/deploy/nginx/certbot/conf:/etc/letsencrypt" \
                  certbot/certbot certonly \
                  --webroot -w /var/www/certbot \
                  "${certbot_args[@]}" \
                  --cert-name "$TLS_DOMAIN" \
                  --non-interactive \
                  --expand \
                  --email "$TLS_EMAIL" \
                  --agree-tos \
                  --no-eff-email \
                  --keep-until-expiring

                sed \
                  -e "s/__SERVER_NAMES__/$SERVER_NAMES/g" \
                  -e "s/__PRIMARY_DOMAIN__/$PRIMARY_DOMAIN/g" \
                  deploy/nginx/default.https.conf > deploy/nginx/default.conf
                compose_cmd up -d --build --remove-orphans
                compose_cmd restart nginx
              ;;
              *) : ;;
            esac

            web_id="$(compose_cmd ps -q web)"
            if [ -z "$web_id" ]; then
              echo "web container id not found"
              compose_cmd ps || true
              compose_cmd logs --tail=200 web || true
              exit 1
            fi

            for i in $(seq 1 90); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$web_id" 2>/dev/null || echo missing)"
              if [ "$health" = "healthy" ]; then
                break
              fi
              if [ "$health" = "unhealthy" ]; then
                echo "Health check failed: container is unhealthy"
                compose_cmd ps || true
                compose_cmd logs --tail=200 web || true
                exit 1
              fi
              if [ "$i" -eq 90 ]; then
                echo "Health check timeout: status=${health}"
                compose_cmd ps || true
                compose_cmd logs --tail=200 web || true
                exit 1
              fi
              sleep 2
            done

            case "$TLS_ENABLED" in
              1) curl -kfsS --resolve "${TLS_DOMAIN}:443:127.0.0.1" "https://${TLS_DOMAIN}/api/healthz" > /dev/null ;;
              *) : ;;
            esac

            docker image prune -f
