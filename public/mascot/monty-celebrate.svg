<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .jump { animation: jump 0.8s ease-in-out infinite; }
    @keyframes jump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    .confetti1 { animation: c1 1.5s ease-out infinite; }
    @keyframes c1 { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(-30px,-60px) rotate(360deg);opacity:0} }
    .confetti2 { animation: c2 1.5s ease-out 0.2s infinite; }
    @keyframes c2 { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(25px,-55px) rotate(-360deg);opacity:0} }
    .confetti3 { animation: c3 1.5s ease-out 0.4s infinite; }
    @keyframes c3 { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(-15px,-50px) rotate(270deg);opacity:0} }
    .party { animation: party 1s ease-in-out infinite; transform-origin: 100px 100px; }
    @keyframes party { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  </style>
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>
  <g class="jump">
    <rect x="78" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
    <rect x="106" y="150" width="16" height="30" rx="6" fill="#1E40AF"/>
    <rect x="74" y="172" width="24" height="12" rx="6" fill="#78350F"/>
    <rect x="102" y="172" width="24" height="12" rx="6" fill="#78350F"/>
    <rect x="72" y="95" width="56" height="60" rx="12" fill="#3B82F6"/>
    <rect x="72" y="120" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
    <rect x="72" y="135" width="56" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
    <rect x="52" y="95" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="48" cy="95" r="8" fill="#FDE68A"/>
    <rect x="128" y="95" width="20" height="12" rx="6" fill="#3B82F6"/>
    <circle cx="152" cy="95" r="8" fill="#FDE68A"/>
    <circle cx="100" cy="70" r="30" fill="#FDE68A"/>
    <path d="M65 65 Q100 25 135 65 L130 70 Q100 40 70 70 Z" fill="#F59E0B"/>
    <rect x="65" y="65" width="70" height="8" rx="4" fill="#D97706"/>
    <rect x="95" y="52" width="10" height="8" rx="2" fill="#FBBF24"/>
    <circle cx="88" cy="72" r="5" fill="white"/>
    <circle cx="112" cy="72" r="5" fill="white"/>
    <circle cx="88" cy="70" r="3" fill="#1E293B"/>
    <circle cx="112" cy="70" r="3" fill="#1E293B"/>
    <path d="M85 82 Q100 98 115 82" stroke="#92400E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="40" y="50" font-size="14" class="confetti1">🎉</text>
  <text x="140" y="45" font-size="12" class="confetti2">🎊</text>
  <text x="90" y="40" font-size="10" class="confetti3">⭐</text>
  <text x="60" y="35" font-size="11" class="confetti1" style="animation-delay:0.6s">✨</text>
  <text x="130" y="55" font-size="9" class="confetti2" style="animation-delay:0.8s">🌟</text>
</svg>
