services:
  web_landing:
    image: ghcr.io/famousmonsterr/montagehub-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_SURFACE: landing
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web_lk:
    image: ghcr.io/famousmonsterr/montagehub-web:latest
    restart: unless-stopped
    env_file: .env
