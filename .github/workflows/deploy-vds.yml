name: Deploy VDS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-vds
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required deploy secrets
        id: check
        env:
          VDS_SSH_HOST: ${{ secrets.VDS_SSH_HOST }}
          VDS_SSH_USER: ${{ secrets.VDS_SSH_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_DEPLOY_PATH: ${{ secrets.VDS_DEPLOY_PATH }}
          VDS_DOMAIN: ${{ secrets.VDS_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          missing=0
          for var in VDS_SSH_HOST VDS_SSH_USER VDS_SSH_KEY VDS_DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "::warning::Missing secret: ${var}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: configure required secrets first."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Deploy secrets are configured."
          if [ -n "$VDS_DOMAIN" ] && [ -z "$LETSENCRYPT_EMAIL" ]; then
            echo "::warning::VDS_DOMAIN is set but LETSENCRYPT_EMAIL is missing. TLS auto-setup will be skipped."
          fi
          if [ -z "$VDS_DOMAIN" ] && [ -n "$LETSENCRYPT_EMAIL" ]; then
            echo "::warning::LETSENCRYPT_EMAIL is set but VDS_DOMAIN is missing. TLS auto-setup will be skipped."
          fi

  deploy:
    needs: preflight
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) &&
      needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_SSH_HOST }}
          username: ${{ secrets.VDS_SSH_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: false
          script: |
            set -ex
            TLS_DOMAIN="${{ secrets.VDS_DOMAIN }}"
            TLS_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"
            TLS_ENABLED=0
            case "$TLS_DOMAIN" in
              "")
                TLS_ENABLED=0
              ;;
              *)
                case "$TLS_EMAIL" in
                  "") TLS_ENABLED=0 ;;
                  *) TLS_ENABLED=1 ;;
                esac
              ;;
            esac
            compose_cmd() {
              docker compose --env-file deploy/.env.vds -f deploy/docker-compose.vds.yml "$@"
            }
            cd "${{ secrets.VDS_DEPLOY_PATH || '/opt/ai-smetchik' }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            df -h
            docker system df || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            mkdir -p deploy/nginx/certbot/www deploy/nginx/certbot/conf
            case "$TLS_ENABLED" in
              1) sed "s/__DOMAIN__/$TLS_DOMAIN/g" deploy/nginx/default.http.conf > deploy/nginx/default.conf ;;
              *) sed "s/__DOMAIN__/_/g" deploy/nginx/default.http.conf > deploy/nginx/default.conf ;;
            esac

            compose_cmd up -d --build --remove-orphans

            case "$TLS_ENABLED" in
              1)
                docker run --rm \
                  -v "$(pwd)/deploy/nginx/certbot/www:/var/www/certbot" \
                  -v "$(pwd)/deploy/nginx/certbot/conf:/etc/letsencrypt" \
                  certbot/certbot certonly \
                  --webroot -w /var/www/certbot \
                  -d "$TLS_DOMAIN" \
                  --email "$TLS_EMAIL" \
                  --agree-tos \
                  --no-eff-email \
                  --keep-until-expiring

                sed "s/__DOMAIN__/$TLS_DOMAIN/g" deploy/nginx/default.https.conf > deploy/nginx/default.conf
                compose_cmd up -d --build --remove-orphans
                compose_cmd restart nginx
              ;;
              *) : ;;
            esac

            for i in $(seq 1 30); do
              if compose_cmd exec -T web node -e "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed after retries"
                compose_cmd ps || true
                compose_cmd logs --tail=200 web || true
                exit 1
              fi
              sleep 2
            done

            case "$TLS_ENABLED" in
              1) curl -kfsS --resolve "${TLS_DOMAIN}:443:127.0.0.1" "https://${TLS_DOMAIN}/api/healthz" > /dev/null ;;
              *) : ;;
            esac

            docker image prune -f
